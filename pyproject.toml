[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-protocol"
version = "0.3.0"
description = "Dual-host anti-deskilling plugin for Codex and Claude Code."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Lorenzo Famiglini", email = "lorenzofamiglini@gmail.com"},
]
keywords = [
    "ai", "cognitive-science", "deskilling", "education",
    "socratic-method", "llm", "codex", "claude-code", "anti-deskilling",
    "thinking", "metacognition",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
]
# No runtime dependencies. The adversarial auditor shells out to the `claude`
# CLI (no API key, no SDK), and lib/modes.py falls back to the committed
# modes/*.json twins on hosts without PyYAML — which is the norm for hook
# handlers because plugins cannot declare their interpreter dependencies.
dependencies = []

[project.optional-dependencies]
# PyYAML is a development dependency: it authors the mode files and
# regenerates the JSON twins via scripts/build_modes_json.py.
dev = [
    "pyyaml>=6.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Repository = "https://github.com/danilotat/forge-protocol"
Upstream = "https://github.com/lorenzofamiglini/The-Forge-Protocol-Agent"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
include = ["lib*", "forge_cc*"]
